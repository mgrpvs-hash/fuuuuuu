version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: room-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: room_bot
      POSTGRES_USER: room_bot
      POSTGRES_PASSWORD: room_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U room_bot -d room_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: room-bot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: room-bot-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.main"

volumes:
  postgres_data:
  redis_data:
